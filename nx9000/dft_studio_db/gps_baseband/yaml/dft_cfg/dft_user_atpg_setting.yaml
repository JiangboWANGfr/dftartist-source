atpg_setting:
  type: atpg_map #atpg_syn atpg_pr
  atpg_map_netlist:  ""
  atpg_syn_netlist:  "xxxx.vg"
  atpg_pr_netlist:   "xxxxxxx.vg"
  int_edt_sa:
     ram_seq: off
     mode_setting:
       current_mode: int_stuck_mode
       scan_mode: int_edt_mode
     nonscan: |
       #add_nonscan_instances [get_instance  *tessent_edt_*_EDT_chan_*_*_lockup_inst*]
       # add_nonscan_instances [get_instance  *dfx_*_edt_channels_*_pipe*]
     blackbox: |
       #add_black_box  -module [get_module  *ssss*]
     test_setup: |
        set_static_dft_signal_values tck_occ_en 1
        source $prj_path/user_material/PDL/dfx_static_hyper_ctl_tdr.pdl
        set_test_setup_icall {u_dfx_static_hyper_ctl_tdr.dfx_sa_hyper_cfg} -merge -append
        set_ijtag_retargeting_options -tck_ratio 4      
     core_inst: |
        set_core_instance_parameters -instrument edt -parameter_values {edt_low_power_shift_en on}
     pin_cell_constraint: |
        add_primary_input u_dfx_static_hyper_ctl_tdr/dfx_hyper_ctl_ff_init
        add_input_constraints u_dfx_static_hyper_ctl_tdr/dfx_hyper_ctl_ff_init -c1
        add_primary_input u_dfx_static_hyper_ctl_tdr/dfx_rst_tdr_n
        add_input_constraints u_dfx_static_hyper_ctl_tdr/dfx_rst_tdr_n -c1
        add_primary_input u_dfx_static_hyper_ctl_tdr/dfx_scan_mode
