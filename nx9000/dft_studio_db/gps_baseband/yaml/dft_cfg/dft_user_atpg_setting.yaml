atpg_retargeting:
   gps_int_edt_sa: 
     harden_name: gps_baseband
     current_mode: int_edt_mode
     netlist:  xxxx.vg
     nonscan: |
        add_nonscan_instances [get_instance  *tessent_edt_*_EDT_chan_*_*_lockup_inst*]
        add_nonscan_instances [get_instance  *dfx_*_edt_channels_*_pipe*]
     blackbox: |
        add_black_box  -module [get_module  *ssss*]
     test_setup: |
        set_static_dft_signal_values tck_occ_en 1
        source $prj_path/user_material/PDL/dfx_static_hyper_ctl_tdr.pdl
        set_test_setup_icall {u_dfx_static_hyper_ctl_tdr.dfx_sa_hyper_cfg} -merge -append
        set_ijtag_retargeting_options -tck_ratio 4      
     core_inst: |
        set_core_instance_parameters -instrument edt -parameter_values {edt_low_power_shift_en on}
     pin_cell_constraint: |
        add_primary_input c/d/e/ltest -C1
        add_input_constraints [get_pins c/d/e/ltest] -C1
        add_primary_input c/d/e/mtest -C1
        add_input_constraints [get_pins c/d/e/mtest] -C1 
     retarget_setting: |
        set_ijtag_retargeting_options -tck_ratio 4
     before_drc: |
        add_clock 0 PAD_CLKIN1v8
        set_attribute_value {{PAD_CLKIN1v8}} -name is_excluded_from_isolation_constraints
        set_drc_handling R27 Warning
        set_drc_handling r8 Warning
     retarget_harden_patdb: |
        read_patterns $prj_path/dft_path/${retarget_harden}/${retarget_harden}_tsdb_outdir/logic_test_cores/${retarget_harden}_scan.logic_test_core/${retarget_harden}.atpg_mode_int_transition_mode/${retarget_harden}_int_transition_mode_transition.patdb


