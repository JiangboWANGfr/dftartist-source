        #add_primary_input u_dfx_dynamic_hyper_ctl/dfx_rst_scan_n
        #add_input_constraints u_dfx_dynamic_hyper_ctl/dfx_rst_scan_n -c1         
     atpg_power_setting: |
        set_power_control shift on -switching_threshold 15 -rejection_threshold 25
     atpg_power_report: |
        set_power_metrics -composite_shift on
        report_power_metrics -shift -all_test -patterns all
     fault_pool: |
        add_faults -all
     fault_grading: |
         read_fault -mode ext_stuck_mode -fault_type stuck -merge
         report_statistics -detailed_analysis
