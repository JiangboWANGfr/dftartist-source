bscan_setting:
   ac_bscan: on
   no_bsd_pad: [list reset_n ptest_dfx_mode ptest si0 si1] 
   int_aux:
     input: [list dat1 dat2 dat3]
     output: [list dato datp]

mbist_setting:   
   sharebus: no
   pin_constraint: 
       a/bc: -C0
       a/c/b: -C1
   clock:
     list0:
        path: xxxx/xxx/xxx/xxx
        label: xxxx
        period: 2ns
        off_state: 0
logic_test_setting:
   ssn: on
   pin_constraint: 
       a/bc: -C0
       a/c/b: -C1
   clock:
     list0:
        path: xxxx/xxx/xxx/xxx
        label: xxxx
        period: 2ns     
   add_core_instance:
       default_setting:
           list0: "add_core_instances -instances [get_instances *_tessent_sib_sti_inst]"
   nonscan:
       module:
         list0: "gps ddr fsi"
       instance:
         list0: "u_dfx_fsi[0]\/ codec/rsu"
         list1: "u_qrsi/d/c/d/f/g/e/g"
   dft_signals:
       register:
          int_stuck_mode:
              usage: scan_mode
              scan_mode_type: internal
          lbist_sa_mode:
              usage: scan_mode
              scan_mode_type: internal
          int_transition_mode:
              usage: scan_mode
              scan_mode_type: internal            
       source_signal:  #//from arch design by user
          scan_en: 
               source_node: "[get_pins u_dfx_scan_enable_persistent_buf_inst/Y]"
               associated_ports: dati
          edt_update: 
               source_node: "[get_pins u_dfx_scan_enable_persistent_buf_inst/Y]"
               associated_ports: dati
          test_clock: 
               source_node: "[get_pins u_dfx_scan_enable_persistent_buf_inst/Y]"
               associated_ports: dati
scan_test_setting:                
