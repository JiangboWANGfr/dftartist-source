design_manager:
   design_name: processor_core
   design_filelist: /home/redhat/ywang/tessent_example_hierarchical_flow_with_ssn_test/design/processor_core/processor_core.flist 
   design_level: physical_block
   design_type: hierarchical
   rtl_or_gate: gate
     #sub_harden:
     #  processor_core: 
     #    path: /home/redhat/ywang/simple_flow/ZYXX_PC_TOP/test/dft_path/processor_core/v1/tsdb_outdir
   #black_box:
   #   module_list: "[list LVDS_TX_RX_IO_TOP NNS28NHKCEDPAUX_1M_18FN1 NNS28NHKCU2OPHY_P3_18FN1]"
   exclude_quick_syntehsis: "xxx xxx DW*"

stage_manager:
        stage1: 
           script_path: 1.mbist_insertion
           design_id: mbist #?
           feature: "mbist bscan ist ijtag mbisr_controller" # mbist =>memory_test bscan=>boundary_scan, mbisr_controller=>mbisr_controller
           dft_req: "-memory_test on -boundary_scan on -mbisr_controller on"
        stage2:
           script_path: 2.logic_test_insertion 
           design_id: logic_test
           feature: "edt occ ssn lbist"
           dft_req: "-logic_test on -add_test_clock_on_ssh on"
        #below can be infer from default rules 
        stage3: 
          script_path: 3.syn_lec 
          lec: g2g
          syn: type2 #bottomup 
        stage4: 
          script_path: 4.scan_insertion
          design_id: scan
        stage5: 
          script_path: 5.lbist_fault_simulation
          design_id: lbist_sa_fsim
        stage6: 
          script_path: 6.lbist_pattern_gen
        stage7: 
          script_path: 7.atpg
          
        stage8: 
          script_path: 8.retargeting
        stage9: 
          script_path: 9.verification
        stage10: 
          script_path: 10.deliver
     
